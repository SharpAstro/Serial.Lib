name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Patch component is github.run_number; MAJOR.MINOR lives in the repo-root Directory.Build.props
  # (VersionMajorMinor) and the build job reads it back, so it cannot drift from what the package declares.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the SDK's first-run banner
  # must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      # -getProperty only EVALUATES the file, so this runs before restore. The shape check makes a renamed
      # property fail the run rather than publish every package as ".<run>".
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      # Microsoft.Testing.Platform (global.json). The bench tests skip: no SERIAL_LIB_BENCH_PORT on a runner.
      run: dotnet test --project src/Serial.Lib.Tests -c $BUILD_CONF --no-build --output Detailed
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
